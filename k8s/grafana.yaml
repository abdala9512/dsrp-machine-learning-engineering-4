            { "expr": "histogram_quantile(0.50, sum(rate(backend_imdb_api_latency_seconds_bucket[1m])) by (le))", "legendFormat": "P50", "refId": "A" },
            { "expr": "histogram_quantile(0.90, sum(rate(backend_imdb_api_latency_seconds_bucket[1m])) by (le))", "legendFormat": "P90", "refId": "B" },
            { "expr": "histogram_quantile(0.95, sum(rate(backend_imdb_api_latency_seconds_bucket[1m])) by (le))", "legendFormat": "P95", "refId": "C" },
            { "expr": "histogram_quantile(0.99, sum(rate(backend_imdb_api_latency_seconds_bucket[1m])) by (le))", "legendFormat": "P99", "refId": "D" }
          ],
          "title": "IMDB API Latency",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisBorderShow": false, "axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto",
                "barAlignment": 0, "drawStyle": "line", "fillOpacity": 30, "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "insertNulls": false, "lineInterpolation": "smooth", "lineWidth": 2, "pointSize": 5,
                "scaleDistribution": { "type": "linear" }, "showPoints": "never", "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }, "thresholdsStyle": { "mode": "off" }
              },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "s"
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "ML Service" }, "properties": [{ "id": "color", "value": { "fixedColor": "blue", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "IMDB API" }, "properties": [{ "id": "color", "value": { "fixedColor": "orange", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "Total Backend" }, "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }] }
            ]
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 31 },
          "id": 11,
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "right", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "pluginVersion": "10.4.0",
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(backend_ml_service_latency_seconds_bucket[1m])) by (le))", "legendFormat": "ML Service", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum(rate(backend_imdb_api_latency_seconds_bucket[1m])) by (le))", "legendFormat": "IMDB API", "refId": "B" },
            { "expr": "histogram_quantile(0.95, sum(rate(backend_request_latency_seconds_bucket[1m])) by (le))", "legendFormat": "Total Backend", "refId": "C" }
          ],
          "title": "Latency Comparison (P95)",
          "type": "timeseries"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["backend", "api", "orchestration"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Backend API",
      "uid": "backend-dashboard",
      "version": 1,
      "weekStart": ""
