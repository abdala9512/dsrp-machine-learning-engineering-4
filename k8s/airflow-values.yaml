# Apache Airflow Helm Chart - Valores para AKS
# Documentacion: https://airflow.apache.org/docs/helm-chart/stable/index.html
#
# Uso:
#   helm repo add apache-airflow https://airflow.apache.org
#   helm install airflow apache-airflow/airflow -n airflow -f k8s/airflow-values.yaml

# Executor: KubernetesExecutor para ejecutar DAGs como pods individuales
executor: "KubernetesExecutor"

# Imagen de Airflow - Custom ML image with pre-installed dependencies
# Built via: .github/workflows/airflow-ml-docker.yml
# Includes: polars, sentence-transformers, qdrant-client, lightgbm, mlflow, dagshub, etc.
images:
  airflow:
    repository: ghcr.io/abdala9512/airflow-ml
    tag: "3.0.1-ml"
    pullPolicy: IfNotPresent

# API Server (Web UI) - Airflow 3.0 renamed webserver to api-server
apiServer:
  replicas: 1
  service:
    type: LoadBalancer
    ports:
      - name: airflow-ui
        port: 80
        targetPort: 8080
      - name: airflow-internal
        port: 8080
        targetPort: 8080
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  # Increase startup probe timeout
  startupProbe:
    failureThreshold: 30
    periodSeconds: 10
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 5

# Default admin user
webserverSecretKey: "my-secret-key-change-in-prod"
createUserJob:
  useHelmHooks: false
defaultUser:
  enabled: true
  role: Admin
  username: admin
  email: admin@example.com
  firstName: Admin
  lastName: User
  password: admin123

# Scheduler
scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Triggerer (para deferrable operators)
triggerer:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

# Workers: Not needed with KubernetesExecutor (tasks run as individual pods)
# workers section omitted - KubernetesExecutor doesn't use persistent workers

# PostgreSQL (base de datos de metadatos)
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: "latest"
  auth:
    username: airflow
    password: airflow123
    database: airflow
  primary:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: managed-csi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Redis (no necesario con KubernetesExecutor)
redis:
  enabled: false

# DAGs - Deployment Options
# --------------------------
# DAGs can be deployed in two ways:
#
# 1. GitHub Actions (CI/CD):
#    - Push to dags/ folder on main branch
#    - GitHub Action (.github/workflows/airflow-dags.yml) auto-deploys to AKS
#    - Requires: AZURE_CREDENTIALS, AKS_RESOURCE_GROUP, AKS_CLUSTER_NAME secrets
#
# 2. Local Upload (Manual):
#    - cd k8s && task airflow:dags:upload           # Upload all DAGs
#    - cd k8s && task airflow:dags:upload:file FILE=../dags/my_dag.py  # Single file
#    - cd k8s && task airflow:dags:list             # List current DAGs
#    - cd k8s && task airflow:dags:delete FILE=my_dag.py  # Delete a DAG
#
# Note: Requires 'task' (go-task) and kubectl configured with AKS credentials
#
dags:
  persistence:
    enabled: false
  # gitSync pulls DAGs from your Git repo automatically
  gitSync:
    enabled: true
    repo: https://github.com/abdala9512/dsrp-machine-learning-engineering-4.git
    branch: main
    subPath: dags
    wait: 60

# Logs
logs:
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: azurefile-csi

# Configuracion extra de Airflow
config:
  core:
    dags_are_paused_at_creation: "True"
    load_examples: "False"
    executor: "KubernetesExecutor"
  scheduler:
    dag_dir_list_interval: "30"  # Scan for new DAGs every 30 seconds (default: 300)
  webserver:
    expose_config: "True"
    rbac: "True"
  kubernetes:
    delete_worker_pods: "True"
    delete_worker_pods_on_failure: "False"

# Fernet key for encrypting connections/variables in the database
# Generate a new one with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
fernetKey: "81HqDtbqAywKSOumSha3BhWNOdQ26slT6K0YaZeZyPs="

# ServiceAccount para KubernetesExecutor
serviceAccount:
  create: true
  name: airflow

# RBAC
rbac:
  create: true
  createSCCRoleBinding: false

# Flower (no necesario con KubernetesExecutor)
flower:
  enabled: false

# StatsD (metricas)
statsd:
  enabled: false

# PgBouncer (connection pooling)
pgbouncer:
  enabled: false

# Ingress (deshabilitado - usamos LoadBalancer)
ingress:
  enabled: false

# Resources para pods de workers (KubernetesExecutor)
# Estos valores se usan cuando se crean pods para ejecutar tasks
# Increased for ML workloads (sentence-transformers, embeddings, etc.)
kubernetesPodTemplate:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
      ephemeral-storage: "4Gi"
    limits:
      cpu: 2000m
      memory: 8Gi
      ephemeral-storage: "10Gi"
