# Flyte Dependencies: PostgreSQL + MinIO
# Desplegar antes del chart flyte-binary
---
# PostgreSQL para Flyte
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flyte-postgresql
  namespace: flyte
  labels:
    app: flyte-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flyte-postgresql
  template:
    metadata:
      labels:
        app: flyte-postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "flyte"
            - name: POSTGRES_PASSWORD
              value: "flyte123"
            - name: POSTGRES_DB
              value: "flyte"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "flyte"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-data
          emptyDir: {}  # Para persistencia usar PVC
---
apiVersion: v1
kind: Service
metadata:
  name: flyte-postgresql
  namespace: flyte
  labels:
    app: flyte-postgresql
spec:
  type: ClusterIP
  selector:
    app: flyte-postgresql
  ports:
    - port: 5432
      targetPort: 5432
---
# MinIO para almacenamiento S3-compatible
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flyte-minio
  namespace: flyte
  labels:
    app: flyte-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flyte-minio
  template:
    metadata:
      labels:
        app: flyte-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              value: "minio"
            - name: MINIO_ROOT_PASSWORD
              value: "miniostorage"
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: minio-data
          emptyDir: {}  # Para persistencia usar PVC
---
apiVersion: v1
kind: Service
metadata:
  name: flyte-minio
  namespace: flyte
  labels:
    app: flyte-minio
spec:
  type: ClusterIP
  selector:
    app: flyte-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# Job para crear el bucket inicial en MinIO
apiVersion: batch/v1
kind: Job
metadata:
  name: flyte-minio-init
  namespace: flyte
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z flyte-minio 9000; do echo waiting for minio; sleep 2; done']
      containers:
        - name: mc
          image: minio/mc:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              mc alias set myminio http://flyte-minio:9000 minio miniostorage
              mc mb --ignore-existing myminio/flyte-data
              mc anonymous set download myminio/flyte-data
              echo "Bucket flyte-data created successfully"
