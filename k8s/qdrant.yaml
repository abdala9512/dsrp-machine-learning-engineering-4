# Qdrant Vector Database - Kubernetes Deployment
# Puertos:
#   - 6333: REST API / Dashboard
#   - 6334: gRPC API
---
# PVC comentado temporalmente - descomentar para persistencia
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: qdrant-storage
#   labels:
#     app: qdrant
# spec:
#   accessModes:
#     - ReadWriteOnce
#   resources:
#     requests:
#       storage: 10Gi
#   storageClassName: managed-csi
# ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  labels:
    app: qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      # Security context para evitar problemas de permisos
      securityContext:
        fsGroup: 1000
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: QDRANT__SERVICE__HTTP_PORT
              value: "6333"
            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"
            - name: QDRANT__SERVICE__ENABLE_STATIC_CONTENT
              value: "true"
            # Logging para debug
            - name: QDRANT__LOG_LEVEL
              value: "INFO"
      volumes:
        - name: qdrant-storage
          emptyDir: {}  # Temporal sin persistencia - cambiar a PVC para produccion
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels:
    app: qdrant
spec:
  type: LoadBalancer
  selector:
    app: qdrant
  ports:
    - name: http
      port: 80
      targetPort: 6333
      protocol: TCP
    - name: grpc
      port: 6334
      targetPort: 6334
      protocol: TCP
