apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app: ollama
    component: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  strategy:
    type: Recreate  # Single instance for model storage
  template:
    metadata:
      labels:
        app: ollama
        component: llm
    spec:
      containers:
        # Main Ollama container
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_HOST
              valueFrom:
                configMapKeyRef:
                  name: ollama-config
                  key: OLLAMA_HOST
            - name: OLLAMA_KEEP_ALIVE
              valueFrom:
                configMapKeyRef:
                  name: ollama-config
                  key: OLLAMA_KEEP_ALIVE
            - name: OLLAMA_NUM_PARALLEL
              valueFrom:
                configMapKeyRef:
                  name: ollama-config
                  key: OLLAMA_NUM_PARALLEL
          resources:
            requests:
              memory: "4Gi"
              cpu: "1"
            limits:
              memory: "8Gi"
              cpu: "4"
              # Uncomment for GPU support
              # nvidia.com/gpu: "1"
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

        # Init container to pull the model
        - name: model-init
          image: curlimages/curl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for Ollama server..."
              sleep 30

              until curl -s http://localhost:11434/api/tags > /dev/null 2>&1; do
                echo "Ollama not ready, waiting..."
                sleep 5
              done

              echo "Pulling model: $OLLAMA_MODEL"
              curl -X POST http://localhost:11434/api/pull \
                -H "Content-Type: application/json" \
                -d "{\"name\": \"$OLLAMA_MODEL\"}"

              echo "Model ready!"
              tail -f /dev/null
          env:
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ollama-config
                  key: OLLAMA_MODEL

      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc

      # Optional: Node selector for GPU nodes
      # nodeSelector:
      #   accelerator: nvidia-gpu

      # Optional: Tolerations for GPU taints
      # tolerations:
      #   - key: "nvidia.com/gpu"
      #     operator: "Exists"
      #     effect: "NoSchedule"

---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    app: ollama
    component: llm
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP
      name: http
  selector:
    app: ollama

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  labels:
    app: ollama
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # Use default storage class or specify one
  # storageClassName: managed-premium
