apiVersion: v1
kind: Secret
metadata:
  name: azure-storage-credentials
  labels:
    app: dsrp-ml-pipeline
    component: storage
type: Opaque
# Values should be base64 encoded
# Use: echo -n "your-value" | base64
stringData:
  # Azure Storage Account name
  AZURE_STORAGE_ACCOUNT_NAME: "dsrpstorage2026"

  # Azure Storage Account key
  AZURE_STORAGE_ACCOUNT_KEY: ""

  # Full connection string (alternative to account name + key)
  AZURE_STORAGE_CONNECTION_STRING: ""

  # Container name for ML pipeline data
  AZURE_CONTAINER_NAME: "ml-pipeline-data"

---
# ConfigMap with non-sensitive Azure settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: azure-storage-config
  labels:
    app: dsrp-ml-pipeline
    component: storage
data:
  # Azure Blob Storage settings
  AZURE_CONTAINER_NAME: "ml-pipeline-data"
  AZURE_BLOB_PREFIX: "dsrp-pipeline"

  # Data paths within container
  DATA_RAW_PATH: "raw"
  DATA_PROCESSED_PATH: "processed"
  DATA_EMBEDDINGS_PATH: "embeddings"
  DATA_MODELS_PATH: "models"
