apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: dsrp-ml-pipeline

namespace: default

resources:
  # Core infrastructure
  - qdrant.yaml
  - azure-storage-secret.yaml
  # Backend API
  - backend.yaml
  # Model serving
  - model-serving.yaml
  # Monitoring
  - prometheus.yaml
  - grafana.yaml
  # Frontend
  - frontend.yaml

# Common labels for all resources
commonLabels:
  project: dsrp-ml-pipeline
  environment: development

# Image customization (can override in overlays)
images:
  - name: ghcr.io/abdala9512/dsrp-backend
    newTag: latest
  - name: ghcr.io/abdala9512/dsrp-model-serving
    newTag: latest
  - name: prom/prometheus
    newTag: v2.51.0
  - name: grafana/grafana
    newTag: "10.4.0"

# ConfigMap generator for dynamic config
configMapGenerator:
  - name: pipeline-config
    literals:
      - QDRANT_URL=http://qdrant:80
      - QDRANT_COLLECTION=imdb-movies-hybrid
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
