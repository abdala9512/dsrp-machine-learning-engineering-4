version: '3'

# =============================================================================
# DSRP MLOps Platform - Master Taskfile
# =============================================================================
# This Taskfile orchestrates the entire deployment of the MLOps platform.
#
# Deployment Modes:
#   task deploy:batch            # Batch mode: Airflow + Qdrant (no frontend)
#   task deploy:realtime         # Real-time: APIs, ML serving, frontend, monitoring
#   task deploy:all              # Deploy everything (all components)
#
# Qdrant Initialization:
#   task qdrant:init             # Populate Qdrant with movie data
#   task qdrant:status           # Check collection status
#   task qdrant:init:delete      # Delete init job (to re-run)
#
# Destroy (auto-detects what's deployed):
#   task destroy:all             # Remove all deployed apps (auto-detect mode)
#   task destroy:batch           # Remove batch mode apps only
#   task destroy:realtime        # Remove real-time mode apps only
#   task destroy:infra           # Destroy AKS cluster (DANGER)
#
# Individual Components:
#   task deploy:infra            # Setup backend + terraform
#   task deploy:app APP=frontend # Deploy a specific app
#   task status                  # Check status of all components
#   task dns:configure           # Configure DNS for all apps
# =============================================================================

vars:
  # Azure/AKS Configuration
  RESOURCE_GROUP: '{{.RESOURCE_GROUP | default "rg-dsrp-mlops"}}'
  CLUSTER_NAME: '{{.CLUSTER_NAME | default "dsrp-mlops-aks"}}'
  LOCATION: '{{.LOCATION | default "eastus"}}'

  # Terraform
  TFVARS_FILE: dsrp-values.tfvars

  # Kubernetes namespaces
  AIRFLOW_NAMESPACE: airflow

  # ==========================================================================
  # APPLICATION REGISTRY - Add new applications here
  # ==========================================================================
  # Format: name|namespace|manifest|service|dns_label|type
  # Types: helm, kubectl
  APPLICATIONS: |
    frontend|default|k8s/frontend.yaml|frontend|dsrp-frontend|kubectl
    backend|default|k8s/backend.yaml|backend|dsrp-backend|kubectl
    model-serving|default|k8s/model-serving.yaml|model-serving|dsrp-model-serving|kubectl
    qdrant|default|k8s/qdrant.yaml|qdrant|qdrant-dsrp|kubectl
    prometheus|default|k8s/prometheus.yaml|prometheus|prometheus-dsrp|kubectl
    grafana|default|k8s/grafana.yaml|grafana|grafana-dsrp|kubectl
    airflow|airflow|k8s/airflow-values.yaml|airflow-api-server|airflow-dsrp|helm

  # ==========================================================================
  # DEPLOYMENT MODES
  # ==========================================================================
  # Batch mode: Airflow for orchestration + supporting services
  BATCH_APPS: "qdrant airflow"

  # Real-time mode: APIs, ML serving, frontend, monitoring
  REALTIME_APPS: "qdrant model-serving backend frontend prometheus grafana"

includes:
  iac:
    taskfile: ./iac/Taskfile.yml
    dir: ./iac
  k8s:
    taskfile: ./k8s/Taskfile.yml
    dir: ./k8s

tasks:
  # ===========================================================================
  # DEFAULT
  # ===========================================================================
  default:
    desc: "Show available tasks"
    cmds:
      - task --list

  # ===========================================================================
  # FULL DEPLOYMENT
  # ===========================================================================
  deploy:all:
    desc: "Deploy everything: infrastructure + all applications + DNS"
    summary: |
      Complete deployment of the MLOps platform from scratch.

      This will:
        1. Setup Terraform backend (Azure Storage)
        2. Deploy AKS cluster with Terraform
        3. Get AKS credentials
        4. Deploy ALL applications (batch + real-time components)
        5. Configure DNS for all applications

      For targeted deployments, use:
        - task deploy:batch     # Airflow + Qdrant only
        - task deploy:realtime  # APIs, ML serving, frontend, monitoring

      Usage:
        task deploy:all
        task deploy:all RESOURCE_GROUP=my-rg CLUSTER_NAME=my-cluster
    cmds:
      - task: deploy:infra
      - task: deploy:apps
      - task: dns:configure

  # ===========================================================================
  # INFRASTRUCTURE
  # ===========================================================================
  deploy:infra:
    desc: "Deploy infrastructure (Terraform backend + AKS)"
    cmds:
      - task: infra:backend
      - task: infra:apply
      - task: infra:credentials

  infra:backend:
    desc: "Setup Terraform backend (Azure Storage)"
    dir: ./iac
    cmds:
      - task: iac:backend:setup

  infra:apply:
    desc: "Apply Terraform to create AKS cluster"
    dir: ./iac
    cmds:
      - |
        set -euo pipefail

        echo "🚀 Deploying AKS infrastructure..."
        echo ""

        # Initialize Terraform
        if [ -f "backend.hcl" ]; then
          terraform init -backend-config=backend.hcl
        else
          echo "⚠️  backend.hcl not found. Run 'task infra:backend' first."
          exit 1
        fi

        # Plan
        echo ""
        echo "📋 Planning changes..."
        terraform plan -var-file={{.TFVARS_FILE}} -out=tfplan

        # Apply
        echo ""
        echo "🔨 Applying changes..."
        terraform apply tfplan

        echo ""
        echo "✅ Infrastructure deployed successfully!"

  infra:credentials:
    desc: "Get AKS credentials for kubectl"
    cmds:
      - |
        set -euo pipefail

        echo "🔑 Getting AKS credentials..."

        # Get cluster info from terraform output or use defaults
        cd iac
        if terraform output -raw cluster_name &>/dev/null; then
          RG=$(terraform output -raw resource_group_name)
          CLUSTER=$(terraform output -raw cluster_name)
        else
          RG="{{.RESOURCE_GROUP}}"
          CLUSTER="{{.CLUSTER_NAME}}"
        fi
        cd ..

        echo "   Resource Group: $RG"
        echo "   Cluster: $CLUSTER"

        az aks get-credentials \
          --resource-group "$RG" \
          --name "$CLUSTER" \
          --overwrite-existing

        echo ""
        echo "✅ kubectl configured!"
        kubectl cluster-info

  # ===========================================================================
  # APPLICATIONS DEPLOYMENT
  # ===========================================================================
  deploy:apps:
    desc: "Deploy all applications"
    cmds:
      - task: deploy:app
        vars: { APP: qdrant }
      - task: deploy:app
        vars: { APP: model-serving }
      - task: deploy:app
        vars: { APP: backend }
      - task: deploy:app
        vars: { APP: frontend }
      - task: deploy:app
        vars: { APP: prometheus }
      - task: deploy:app
        vars: { APP: grafana }
      - task: deploy:app
        vars: { APP: airflow }

  # ===========================================================================
  # DEPLOYMENT MODES
  # ===========================================================================
  deploy:batch:
    desc: "Deploy batch mode (Airflow + Qdrant for batch processing)"
    summary: |
      Deploys the batch processing stack:
        - Qdrant: Vector database for embeddings storage
        - Airflow: Workflow orchestration for batch ML pipelines

      Usage:
        task deploy:batch
    cmds:
      - |
        set -euo pipefail
        echo "🔄 Deploying BATCH mode..."
        echo "   Components: {{.BATCH_APPS}}"
        echo ""

        for app in {{.BATCH_APPS}}; do
          task deploy:app APP="$app"
        done

        # Mark deployment mode
        kubectl create configmap dsrp-deployment-mode \
          --from-literal=mode=batch \
          --from-literal=apps="{{.BATCH_APPS}}" \
          --dry-run=client -o yaml | kubectl apply -f -

        echo ""
        echo "✅ Batch mode deployed!"
        echo ""
        echo "📋 Deployed components:"
        for app in {{.BATCH_APPS}}; do
          echo "   - $app"
        done

  deploy:realtime:
    desc: "Deploy real-time mode (APIs, ML serving, frontend, monitoring)"
    summary: |
      Deploys the real-time serving stack:
        - Qdrant: Vector database for similarity search
        - Model-serving: ML inference API (LightGBM LTR + embeddings)
        - Backend: API orchestration layer
        - Frontend: User interface
        - Prometheus: Metrics collection
        - Grafana: Monitoring dashboards

      By default, also initializes Qdrant with movie data.

      Usage:
        task deploy:realtime                  # Deploy + init Qdrant
        task deploy:realtime SKIP_INIT=true   # Deploy without init
    vars:
      SKIP_INIT: '{{.SKIP_INIT | default "false"}}'
    cmds:
      - |
        set -euo pipefail
        echo "⚡ Deploying REAL-TIME mode..."
        echo "   Components: {{.REALTIME_APPS}}"
        echo "   Initialize Qdrant: {{if eq .SKIP_INIT "true"}}No{{else}}Yes{{end}}"
        echo ""

        for app in {{.REALTIME_APPS}}; do
          task deploy:app APP="$app"
        done

        # Mark deployment mode
        kubectl create configmap dsrp-deployment-mode \
          --from-literal=mode=realtime \
          --from-literal=apps="{{.REALTIME_APPS}}" \
          --dry-run=client -o yaml | kubectl apply -f -

        echo ""
        echo "✅ Real-time mode deployed!"
        echo ""
        echo "📋 Deployed components:"
        for app in {{.REALTIME_APPS}}; do
          echo "   - $app"
        done

      # Initialize Qdrant if not skipped
      - |
        if [ "{{.SKIP_INIT}}" != "true" ]; then
          echo ""
          echo "🔄 Initializing Qdrant collection..."
          task qdrant:init || echo "⚠️  Qdrant init failed. Run 'task qdrant:init' manually."
        else
          echo ""
          echo "ℹ️  Skipping Qdrant initialization. Run 'task qdrant:init' when ready."
        fi

  deploy:app:
    desc: "Deploy a specific application"
    summary: |
      Deploy a single application to the cluster.

      Usage:
        task deploy:app APP=frontend
        task deploy:app APP=qdrant
        task deploy:app APP=airflow

      To add a new application, add it to the APPLICATIONS variable in this Taskfile.
    vars:
      APP: '{{.APP | default ""}}'
    preconditions:
      - sh: '[ -n "{{.APP}}" ]'
        msg: "Error: APP is required. Usage: task deploy:app APP=<app-name>"
    cmds:
      - |
        set -euo pipefail

        APP_NAME="{{.APP}}"

        # Parse application registry
        APP_CONFIG=$(echo '{{.APPLICATIONS}}' | grep "^${APP_NAME}|" || true)

        if [ -z "$APP_CONFIG" ]; then
          echo "❌ Unknown application: $APP_NAME"
          echo ""
          echo "Available applications:"
          echo '{{.APPLICATIONS}}' | cut -d'|' -f1 | sed 's/^/  - /'
          exit 1
        fi

        # Parse config: name|namespace|manifest|service|dns_label|type
        NAMESPACE=$(echo "$APP_CONFIG" | cut -d'|' -f2)
        MANIFEST=$(echo "$APP_CONFIG" | cut -d'|' -f3)
        SERVICE=$(echo "$APP_CONFIG" | cut -d'|' -f4)
        DNS_LABEL=$(echo "$APP_CONFIG" | cut -d'|' -f5)
        DEPLOY_TYPE=$(echo "$APP_CONFIG" | cut -d'|' -f6)

        echo "🚀 Deploying: $APP_NAME"
        echo "   Namespace: $NAMESPACE"
        echo "   Manifest: $MANIFEST"
        echo "   Type: $DEPLOY_TYPE"
        echo ""

        # Create namespace if needed
        if [ "$NAMESPACE" != "default" ]; then
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
        fi

        # Deploy based on type
        case "$DEPLOY_TYPE" in
          kubectl)
            echo "📦 Applying kubectl manifest..."
            kubectl apply -f "$MANIFEST"
            ;;
          helm)
            echo "📦 Installing/upgrading Helm chart..."
            if [ "$APP_NAME" = "airflow" ]; then
              # Add Airflow repo if not exists
              helm repo add apache-airflow https://airflow.apache.org 2>/dev/null || true
              helm repo update

              helm upgrade --install airflow apache-airflow/airflow \
                --namespace "$NAMESPACE" \
                --values "$MANIFEST" \
                --timeout 15m
            fi
            ;;
          *)
            echo "❌ Unknown deploy type: $DEPLOY_TYPE"
            exit 1
            ;;
        esac

        echo ""
        echo "⏳ Waiting for deployment to be ready..."

        # Wait for pods to be ready
        case "$APP_NAME" in
          airflow)
            kubectl wait --for=condition=ready pod \
              -l component=api-server \
              -n "$NAMESPACE" \
              --timeout=300s 2>/dev/null || echo "   Still starting..."
            ;;
          *)
            kubectl wait --for=condition=ready pod \
              -l app="$APP_NAME" \
              -n "$NAMESPACE" \
              --timeout=120s 2>/dev/null || echo "   Still starting..."
            ;;
        esac

        echo ""
        echo "✅ $APP_NAME deployed!"
        echo ""
        echo "📊 Status:"
        kubectl get pods -n "$NAMESPACE" -l app="$APP_NAME" 2>/dev/null || \
          kubectl get pods -n "$NAMESPACE" | head -10

  # ===========================================================================
  # DNS CONFIGURATION
  # ===========================================================================
  dns:configure:
    desc: "Configure DNS for all applications"
    cmds:
      - |
        set -euo pipefail

        echo "🌐 Configuring DNS for all applications..."
        echo ""

        # Parse applications and configure DNS
        echo '{{.APPLICATIONS}}' | while IFS='|' read -r NAME NAMESPACE MANIFEST SERVICE DNS_LABEL TYPE; do
          [ -z "$NAME" ] && continue

          echo "🏷️  Configuring DNS for: $NAME"
          echo "   Service: $SERVICE"
          echo "   Namespace: $NAMESPACE"
          echo "   DNS Label: $DNS_LABEL"

          # Check if service exists and has external IP
          EXTERNAL_IP=$(kubectl get svc "$SERVICE" -n "$NAMESPACE" \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")

          if [ -z "$EXTERNAL_IP" ]; then
            echo "   ⏳ Waiting for external IP..."
            sleep 10
            EXTERNAL_IP=$(kubectl get svc "$SERVICE" -n "$NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          fi

          if [ -n "$EXTERNAL_IP" ]; then
            echo "   IP: $EXTERNAL_IP"
            cd iac && task dns:set-label SERVICE="$SERVICE" NS="$NAMESPACE" LABEL="$DNS_LABEL" && cd ..
          else
            echo "   ⚠️  No external IP yet. Skipping DNS configuration."
          fi

          echo ""
        done

        echo "✅ DNS configuration complete!"

  dns:app:
    desc: "Configure DNS for a specific application"
    vars:
      APP: '{{.APP | default ""}}'
    preconditions:
      - sh: '[ -n "{{.APP}}" ]'
        msg: "Error: APP is required. Usage: task dns:app APP=<app-name>"
    cmds:
      - |
        set -euo pipefail

        APP_NAME="{{.APP}}"
        APP_CONFIG=$(echo '{{.APPLICATIONS}}' | grep "^${APP_NAME}|" || true)

        if [ -z "$APP_CONFIG" ]; then
          echo "❌ Unknown application: $APP_NAME"
          exit 1
        fi

        NAMESPACE=$(echo "$APP_CONFIG" | cut -d'|' -f2)
        SERVICE=$(echo "$APP_CONFIG" | cut -d'|' -f4)
        DNS_LABEL=$(echo "$APP_CONFIG" | cut -d'|' -f5)

        echo "🏷️  Configuring DNS for: $APP_NAME"
        cd iac && task dns:set-label SERVICE="$SERVICE" NS="$NAMESPACE" LABEL="$DNS_LABEL"

  # ===========================================================================
  # STATUS & MONITORING
  # ===========================================================================
  status:
    desc: "Show status of all components"
    cmds:
      - |
        set -euo pipefail

        echo "📊 DSRP MLOps Platform Status"
        echo "=============================="
        echo ""

        # Cluster info
        echo "🔷 Cluster:"
        kubectl cluster-info 2>/dev/null | head -2 || echo "   Not connected"
        echo ""

        # Nodes
        echo "🔷 Nodes:"
        kubectl get nodes 2>/dev/null || echo "   Cannot get nodes"
        echo ""

        # Applications status
        echo "🔷 Applications:"
        echo ""

        echo '{{.APPLICATIONS}}' | while IFS='|' read -r NAME NAMESPACE MANIFEST SERVICE DNS_LABEL TYPE; do
          [ -z "$NAME" ] && continue

          echo "  📦 $NAME (namespace: $NAMESPACE)"

          # Get pods
          PODS=$(kubectl get pods -n "$NAMESPACE" -l app="$NAME" --no-headers 2>/dev/null || \
                 kubectl get pods -n "$NAMESPACE" --no-headers 2>/dev/null | head -5)

          if [ -n "$PODS" ]; then
            echo "$PODS" | awk '{print "     " $1 " - " $3}'
          else
            echo "     No pods found"
          fi

          # Get service IP
          SVC_IP=$(kubectl get svc "$SERVICE" -n "$NAMESPACE" \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")

          if [ -n "$SVC_IP" ]; then
            echo "     URL: http://$SVC_IP"
          fi

          echo ""
        done

  status:app:
    desc: "Show detailed status for a specific application"
    vars:
      APP: '{{.APP | default ""}}'
    preconditions:
      - sh: '[ -n "{{.APP}}" ]'
        msg: "Error: APP is required. Usage: task status:app APP=<app-name>"
    cmds:
      - |
        set -euo pipefail

        APP_NAME="{{.APP}}"
        APP_CONFIG=$(echo '{{.APPLICATIONS}}' | grep "^${APP_NAME}|" || true)

        if [ -z "$APP_CONFIG" ]; then
          echo "❌ Unknown application: $APP_NAME"
          exit 1
        fi

        NAMESPACE=$(echo "$APP_CONFIG" | cut -d'|' -f2)
        SERVICE=$(echo "$APP_CONFIG" | cut -d'|' -f4)

        echo "📊 Status: $APP_NAME"
        echo "===================="
        echo ""

        echo "🔷 Pods:"
        kubectl get pods -n "$NAMESPACE" -o wide
        echo ""

        echo "🔷 Services:"
        kubectl get svc -n "$NAMESPACE"
        echo ""

        echo "🔷 Recent Events:"
        kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' | tail -10

  # ===========================================================================
  # CLEANUP
  # ===========================================================================
  destroy:app:
    desc: "Remove a specific application"
    vars:
      APP: '{{.APP | default ""}}'
    preconditions:
      - sh: '[ -n "{{.APP}}" ]'
        msg: "Error: APP is required. Usage: task destroy:app APP=<app-name>"
    cmds:
      - |
        set -euo pipefail

        APP_NAME="{{.APP}}"
        APP_CONFIG=$(echo '{{.APPLICATIONS}}' | grep "^${APP_NAME}|" || true)

        if [ -z "$APP_CONFIG" ]; then
          echo "❌ Unknown application: $APP_NAME"
          exit 1
        fi

        NAMESPACE=$(echo "$APP_CONFIG" | cut -d'|' -f2)
        MANIFEST=$(echo "$APP_CONFIG" | cut -d'|' -f3)
        DEPLOY_TYPE=$(echo "$APP_CONFIG" | cut -d'|' -f6)

        echo "🗑️  Removing: $APP_NAME"

        case "$DEPLOY_TYPE" in
          kubectl)
            kubectl delete -f "$MANIFEST" --ignore-not-found
            ;;
          helm)
            helm uninstall "$APP_NAME" -n "$NAMESPACE" 2>/dev/null || echo "   Not installed"
            ;;
        esac

        echo "✅ $APP_NAME removed"

  destroy:all:
    desc: "Remove all deployed applications (auto-detects deployment mode)"
    cmds:
      - |
        set -euo pipefail

        echo "🔍 Detecting deployment mode..."
        echo ""

        # Check for deployment mode configmap
        MODE=$(kubectl get configmap dsrp-deployment-mode -o jsonpath='{.data.mode}' 2>/dev/null || echo "")
        DEPLOYED_APPS=$(kubectl get configmap dsrp-deployment-mode -o jsonpath='{.data.apps}' 2>/dev/null || echo "")

        if [ -n "$MODE" ] && [ -n "$DEPLOYED_APPS" ]; then
          echo "📋 Detected mode: $MODE"
          echo "   Applications: $DEPLOYED_APPS"
          echo ""

          # Destroy apps in reverse order
          APPS_REVERSED=$(echo "$DEPLOYED_APPS" | tr ' ' '\n' | tac | tr '\n' ' ')
          for app in $APPS_REVERSED; do
            task destroy:app APP="$app" || true
          done

          # Remove the deployment mode configmap
          kubectl delete configmap dsrp-deployment-mode --ignore-not-found

        else
          echo "⚠️  No deployment mode detected. Scanning for deployed apps..."
          echo ""

          # Fallback: check which apps actually exist and destroy them
          ALL_APPS="airflow grafana prometheus frontend backend model-serving qdrant"

          for app in $ALL_APPS; do
            # Check if app exists based on type
            case "$app" in
              airflow)
                if helm status airflow -n airflow &>/dev/null; then
                  echo "   Found: $app (helm)"
                  task destroy:app APP="$app" || true
                fi
                ;;
              *)
                if kubectl get deployment "$app" &>/dev/null; then
                  echo "   Found: $app (kubectl)"
                  task destroy:app APP="$app" || true
                fi
                ;;
            esac
          done
        fi

        echo ""
        echo "✅ Cleanup complete!"

  destroy:batch:
    desc: "Remove batch mode applications"
    cmds:
      - |
        set -euo pipefail
        echo "🗑️  Removing BATCH mode applications..."
        echo ""

        # Reverse order for proper cleanup
        for app in airflow qdrant; do
          task destroy:app APP="$app" || true
        done

        kubectl delete configmap dsrp-deployment-mode --ignore-not-found
        echo ""
        echo "✅ Batch mode removed!"

  destroy:realtime:
    desc: "Remove real-time mode applications"
    cmds:
      - |
        set -euo pipefail
        echo "🗑️  Removing REAL-TIME mode applications..."
        echo ""

        # Reverse order for proper cleanup (frontend first, then backend, etc.)
        for app in grafana prometheus frontend backend model-serving qdrant; do
          task destroy:app APP="$app" || true
        done

        kubectl delete configmap dsrp-deployment-mode --ignore-not-found
        echo ""
        echo "✅ Real-time mode removed!"

  destroy:infra:
    desc: "Destroy infrastructure (DANGER: destroys AKS cluster)"
    dir: ./iac
    cmds:
      - |
        set -euo pipefail

        echo "⚠️  WARNING: This will destroy the AKS cluster and all resources!"
        echo ""
        read -p "Type 'yes' to confirm: " CONFIRM

        if [ "$CONFIRM" != "yes" ]; then
          echo "Aborted."
          exit 1
        fi

        terraform destroy -var-file={{.TFVARS_FILE}}

  # ===========================================================================
  # QDRANT INITIALIZATION
  # ===========================================================================
  qdrant:init:
    desc: "Initialize Qdrant with IMDB movies collection"
    summary: |
      Runs a Kubernetes Job to populate Qdrant with movie data.

      Prerequisites:
        - Qdrant must be deployed and running
        - Azure storage credentials must be configured

      The job will:
        1. Download movie data from Azure Blob Storage
        2. Create the hybrid search collection (dense + BM25)
        3. Generate embeddings and index all movies
        4. Verify the index with test searches

      Usage:
        task qdrant:init                    # Run init job
        task qdrant:init FORCE_REINDEX=true # Force re-index
    vars:
      FORCE_REINDEX: '{{.FORCE_REINDEX | default "true"}}'
    cmds:
      - |
        set -euo pipefail

        echo "🔄 Initializing Qdrant collection..."
        echo ""

        # Check if Qdrant is running
        if ! kubectl get deployment qdrant &>/dev/null; then
          echo "❌ Qdrant is not deployed. Run 'task deploy:app APP=qdrant' first."
          exit 1
        fi

        # Wait for Qdrant to be ready
        echo "⏳ Waiting for Qdrant to be ready..."
        kubectl wait --for=condition=ready pod -l app=qdrant --timeout=120s

        # Delete previous job if exists
        kubectl delete job qdrant-init --ignore-not-found
        echo ""

        # Update force reindex setting
        kubectl create configmap qdrant-init-config \
          --from-literal=QDRANT_URL="http://qdrant:80" \
          --from-literal=COLLECTION_NAME="imdb-movies-hybrid" \
          --from-literal=EMBEDDING_MODEL="sentence-transformers/all-MiniLM-L6-v2" \
          --from-literal=BATCH_SIZE="500" \
          --from-literal=FORCE_REINDEX="{{.FORCE_REINDEX}}" \
          --from-literal=AZURE_CONTAINER_NAME="ml-pipeline-data" \
          --from-literal=BLOB_PATH="airflow-prod/complete_imdb_database.parquet" \
          --dry-run=client -o yaml | kubectl apply -f -

        # Apply the job
        echo "📦 Starting Qdrant init job..."
        kubectl apply -f k8s/qdrant-init-job.yaml

        # Follow logs
        echo ""
        echo "📋 Job logs:"
        echo "---"
        kubectl wait --for=condition=ready pod -l app=qdrant-init --timeout=60s 2>/dev/null || true
        kubectl logs -f job/qdrant-init || true

        # Check job status
        echo ""
        echo "---"
        JOB_STATUS=$(kubectl get job qdrant-init -o jsonpath='{.status.succeeded}' 2>/dev/null || echo "0")
        if [ "$JOB_STATUS" = "1" ]; then
          echo "✅ Qdrant initialization completed successfully!"
        else
          echo "❌ Qdrant initialization failed. Check logs above."
          exit 1
        fi

  qdrant:status:
    desc: "Check Qdrant collection status"
    cmds:
      - |
        set -euo pipefail

        echo "📊 Qdrant Collection Status"
        echo "==========================="
        echo ""

        # Get Qdrant pod
        QDRANT_POD=$(kubectl get pods -l app=qdrant -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")

        if [ -z "$QDRANT_POD" ]; then
          echo "❌ Qdrant is not running"
          exit 1
        fi

        # Get external IP
        QDRANT_IP=$(kubectl get svc qdrant -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")

        echo "🔷 Pod: $QDRANT_POD"
        if [ -n "$QDRANT_IP" ]; then
          echo "🔷 External URL: http://$QDRANT_IP"
          echo ""

          # Get collections info
          echo "🔷 Collections:"
          curl -s "http://$QDRANT_IP/collections" | python3 -m json.tool 2>/dev/null || echo "   Could not fetch collections"
        else
          echo "🔷 External IP: Not assigned yet"
          echo ""
          echo "Use port-forward to access: kubectl port-forward svc/qdrant 6333:80"
        fi

  qdrant:init:logs:
    desc: "Show Qdrant init job logs"
    cmds:
      - kubectl logs job/qdrant-init --tail=100 2>/dev/null || echo "No init job found"

  qdrant:init:delete:
    desc: "Delete Qdrant init job (to re-run)"
    cmds:
      - kubectl delete job qdrant-init --ignore-not-found
      - echo "✅ Qdrant init job deleted. Run 'task qdrant:init' to re-initialize."

  # ===========================================================================
  # UTILITIES
  # ===========================================================================
  logs:
    desc: "Show logs for an application"
    vars:
      APP: '{{.APP | default ""}}'
      TAIL: '{{.TAIL | default "100"}}'
    preconditions:
      - sh: '[ -n "{{.APP}}" ]'
        msg: "Error: APP is required. Usage: task logs APP=<app-name>"
    cmds:
      - |
        set -euo pipefail

        APP_NAME="{{.APP}}"
        APP_CONFIG=$(echo '{{.APPLICATIONS}}' | grep "^${APP_NAME}|" || true)

        if [ -z "$APP_CONFIG" ]; then
          echo "❌ Unknown application: $APP_NAME"
          exit 1
        fi

        NAMESPACE=$(echo "$APP_CONFIG" | cut -d'|' -f2)

        echo "📋 Logs for: $APP_NAME (namespace: $NAMESPACE)"
        echo ""

        kubectl logs -n "$NAMESPACE" -l app="$APP_NAME" --tail={{.TAIL}} 2>/dev/null || \
          kubectl logs -n "$NAMESPACE" $(kubectl get pods -n "$NAMESPACE" -o jsonpath='{.items[0].metadata.name}') --tail={{.TAIL}}

  port-forward:
    desc: "Port-forward to an application"
    vars:
      APP: '{{.APP | default ""}}'
      LOCAL_PORT: '{{.LOCAL_PORT | default "8080"}}'
    preconditions:
      - sh: '[ -n "{{.APP}}" ]'
        msg: "Error: APP is required. Usage: task port-forward APP=<app-name>"
    cmds:
      - |
        set -euo pipefail

        APP_NAME="{{.APP}}"
        APP_CONFIG=$(echo '{{.APPLICATIONS}}' | grep "^${APP_NAME}|" || true)

        if [ -z "$APP_CONFIG" ]; then
          echo "❌ Unknown application: $APP_NAME"
          exit 1
        fi

        NAMESPACE=$(echo "$APP_CONFIG" | cut -d'|' -f2)
        SERVICE=$(echo "$APP_CONFIG" | cut -d'|' -f4)

        # Determine port based on app
        case "$APP_NAME" in
          airflow)
            REMOTE_PORT=8080
            ;;
          *)
            REMOTE_PORT=80
            ;;
        esac

        echo "🔗 Port-forwarding $APP_NAME"
        echo "   Local: http://localhost:{{.LOCAL_PORT}}"
        echo "   Press Ctrl+C to stop"
        echo ""

        kubectl port-forward svc/"$SERVICE" {{.LOCAL_PORT}}:$REMOTE_PORT -n "$NAMESPACE"

  # ===========================================================================
  # HELPER TASKS
  # ===========================================================================
  apps:list:
    desc: "List all registered applications"
    cmds:
      - |
        echo "📦 Registered Applications"
        echo "=========================="
        echo ""
        echo "Name          | Namespace | Type   | Mode(s)           | Service"
        echo "--------------|-----------|--------|-------------------|------------------"
        echo '{{.APPLICATIONS}}' | while IFS='|' read -r NAME NAMESPACE MANIFEST SERVICE DNS_LABEL TYPE; do
          [ -z "$NAME" ] && continue

          # Determine which mode(s) this app belongs to
          MODES=""
          if echo "{{.BATCH_APPS}}" | grep -qw "$NAME"; then
            MODES="batch"
          fi
          if echo "{{.REALTIME_APPS}}" | grep -qw "$NAME"; then
            if [ -n "$MODES" ]; then
              MODES="$MODES,realtime"
            else
              MODES="realtime"
            fi
          fi
          [ -z "$MODES" ] && MODES="-"

          printf "%-13s | %-9s | %-6s | %-17s | %s\n" "$NAME" "$NAMESPACE" "$TYPE" "$MODES" "$SERVICE"
        done
        echo ""
        echo "Deployment Modes:"
        echo "  task deploy:batch    -> {{.BATCH_APPS}}"
        echo "  task deploy:realtime -> {{.REALTIME_APPS}}"
        echo ""
        echo "To add a new application, edit the APPLICATIONS variable in Taskfile.yml"
