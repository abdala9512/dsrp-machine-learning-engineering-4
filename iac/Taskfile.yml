version: '3'

vars:
  BACKEND_RG_NAME: "rg-terraform-state-dsrp4"
  BACKEND_LOCATION: "East US"
  CONTAINER_NAME: "tfstate"
  KEY_NAME: "mlops-dsrp4.terraform.tfstate"
  TFVARS_FILE: "dsrp-values.tfvars"

tasks:
  default:
    desc: "Muestra las tareas disponibles"
    cmds:
      - task --list

  backend:setup:
    desc: "Crea el storage account y genera backend.hcl para Terraform"
    cmds:
      - |
        echo "🧹 Limpiando estado local de Terraform..."
        if [ -d ".terraform" ]; then
          rm -rf .terraform
          echo "✅ Carpeta .terraform eliminada"
        else
          echo "ℹ️  No existe carpeta .terraform"
        fi
        if [ -f ".terraform.lock.hcl" ]; then
          rm -f .terraform.lock.hcl
          echo "✅ Archivo .terraform.lock.hcl eliminado"
        fi
        echo ""
        echo "🚀 Creando backend de Terraform..."
        # Generar nombre único para storage account
        RANDOM_SUFFIX=$(openssl rand -hex 4 | tr '[:upper:]' '[:lower:]')
        STORAGE_NAME="tfstatedsrp4${RANDOM_SUFFIX}"
        echo "📦 Storage Account: ${STORAGE_NAME}"
        
        # Verificar autenticación y suscripción
        if ! az account show &> /dev/null; then
          echo "⚠️  Autenticando en Azure..."
          az login
        fi
        
        # Mostrar información de la suscripción activa
        echo ""
        echo "📋 Información de la suscripción:"
        SUBSCRIPTION_INFO=$(az account show --query '{Name:name, SubscriptionId:id, State:state}' -o tsv 2>&1)
        if [ $? -eq 0 ]; then
          echo "$SUBSCRIPTION_INFO" | awk '{print "   " $0}'
        else
          echo "❌ Error: No se pudo obtener información de la suscripción"
          echo "$SUBSCRIPTION_INFO"
          exit 1
        fi
        echo ""
        
        # Verificar y registrar proveedores necesarios
        echo "0️⃣ Verificando proveedores de Azure..."
        STORAGE_PROVIDER=$(az provider show --namespace Microsoft.Storage --query "registrationState" -o tsv 2>/dev/null)
        if [ "$STORAGE_PROVIDER" != "Registered" ]; then
          if [ "$STORAGE_PROVIDER" = "Registering" ]; then
            echo "   ⏳ El proveedor Microsoft.Storage se está registrando..."
            echo "   Esperando a que termine (puede tomar 1-5 minutos)..."
            az provider register --namespace Microsoft.Storage --wait
          else
            echo "   📝 Registrando proveedor Microsoft.Storage..."
            az provider register --namespace Microsoft.Storage --wait
          fi
          
          # Verificar que se registró correctamente
          STORAGE_PROVIDER=$(az provider show --namespace Microsoft.Storage --query "registrationState" -o tsv 2>/dev/null)
          if [ "$STORAGE_PROVIDER" = "Registered" ]; then
            echo "✅ Proveedor Microsoft.Storage registrado"
          else
            echo "❌ Error: No se pudo registrar el proveedor Microsoft.Storage"
            echo "   Estado actual: $STORAGE_PROVIDER"
            exit 1
          fi
        else
          echo "✅ Proveedor Microsoft.Storage ya está registrado"
        fi
        echo ""
        
        # Crear grupo de recursos
        echo "1️⃣ Creando grupo de recursos..."
        if az group show --name "{{.BACKEND_RG_NAME}}" &> /dev/null; then
          echo "✅ Grupo de recursos ya existe"
        else
          if az group create \
            --name "{{.BACKEND_RG_NAME}}" \
            --location "{{.BACKEND_LOCATION}}" \
            --output none; then
            echo "✅ Grupo de recursos creado"
          else
            echo "❌ Error al crear el grupo de recursos"
            exit 1
          fi
        fi
        
        # Crear storage account
        echo "2️⃣ Creando storage account..."
        if az storage account show --name "${STORAGE_NAME}" --resource-group "{{.BACKEND_RG_NAME}}" &> /dev/null; then
          echo "✅ Storage account ya existe: ${STORAGE_NAME}"
        else
          if az storage account create \
            --resource-group "{{.BACKEND_RG_NAME}}" \
            --name "${STORAGE_NAME}" \
            --sku Standard_LRS \
            --encryption-services blob \
            --location "{{.BACKEND_LOCATION}}" \
            --allow-blob-public-access false \
            --min-tls-version TLS1_2 \
            --output none; then
            echo "✅ Storage account creado: ${STORAGE_NAME}"
          else
            echo "❌ Error al crear el storage account"
            exit 1
          fi
        fi
        
        sleep 5
        
        # Configurar seguridad
        echo "3️⃣ Configurando seguridad..."
        az storage account blob-service-properties update \
          --account-name "${STORAGE_NAME}" \
          --resource-group "{{.BACKEND_RG_NAME}}" \
          --enable-versioning true \
          --enable-delete-retention true \
          --delete-retention-days 30 \
          --output none
        
        # Crear container
        echo "4️⃣ Creando container..."
        az storage container create \
          --name "{{.CONTAINER_NAME}}" \
          --account-name "${STORAGE_NAME}" \
          --auth-mode login \
          --output none || echo "✅ Container ya existe"
        
        # Crear backend.hcl
        echo "5️⃣ Creando backend.hcl..."
        {
          echo "resource_group_name  = \"{{.BACKEND_RG_NAME}}\""
          echo "storage_account_name = \"${STORAGE_NAME}\""
          echo "container_name       = \"{{.CONTAINER_NAME}}\""
          echo "key                  = \"{{.KEY_NAME}}\""
        } > backend.hcl
        
        echo ""
        echo "✅ Backend creado exitosamente!"
        echo "📝 Storage Account: ${STORAGE_NAME}"
        echo ""
        echo "💡 Siguiente paso:"
        echo "   terraform init -backend-config=backend.hcl"

  aks:ip-access:
    desc: "Configura las IPs autorizadas para acceder al cluster AKS"
    summary: |
      Configura authorized_ip_ranges y admin_access_cidrs en el tfvars.

      Uso:
        task aks:ip-access MODE=open           # Abre acceso a todo internet (0.0.0.0/0)
        task aks:ip-access MODE=current        # Usa tu IP pública actual (auto-detectada)
        task aks:ip-access MODE=ips IPS="1.2.3.4,5.6.7.8"  # IPs específicas

      Después de ejecutar, aplica los cambios:
        terraform plan -var-file={{.TFVARS_FILE}}
        terraform apply -var-file={{.TFVARS_FILE}}
    vars:
      MODE: '{{.MODE | default "current"}}'
      IPS: '{{.IPS | default ""}}'
    cmds:
      - |
        set -euo pipefail

        MODE="{{.MODE}}"
        IPS="{{.IPS}}"
        TFVARS="{{.TFVARS_FILE}}"

        echo ""
        echo "🔧 Configurando acceso IP al cluster AKS"
        echo "   Modo: $MODE"
        echo "   Archivo: $TFVARS"
        echo ""

        # Determinar las IPs a configurar
        case "$MODE" in
          open)
            echo "⚠️  ADVERTENCIA: Abriendo acceso a TODO internet (0.0.0.0/0)"
            echo "   Esto es inseguro para producción. Usar solo temporalmente."
            echo ""
            IP_LIST='["0.0.0.0/0"]'
            ;;
          current)
            echo "🔎 Detectando tu IP pública actual..."
            CURRENT_IP=$(curl -s https://api.ipify.org || curl -s https://ifconfig.me || curl -s https://icanhazip.com)
            if [ -z "$CURRENT_IP" ]; then
              echo "❌ No se pudo detectar la IP pública"
              exit 1
            fi
            echo "✅ Tu IP actual: $CURRENT_IP"
            IP_LIST="[\"${CURRENT_IP}/32\"]"
            ;;
          ips)
            if [ -z "$IPS" ]; then
              echo "❌ Error: MODE=ips requiere IPS=\"ip1,ip2,...\""
              exit 1
            fi
            echo "📋 IPs proporcionadas: $IPS"
            # Convertir lista separada por comas a formato Terraform
            IP_LIST="["
            FIRST=true
            IFS=',' read -ra IP_ARRAY <<< "$IPS"
            for ip in "${IP_ARRAY[@]}"; do
              ip=$(echo "$ip" | xargs)  # trim whitespace
              # Agregar /32 si no tiene CIDR
              if [[ ! "$ip" =~ "/" ]]; then
                ip="${ip}/32"
              fi
              if [ "$FIRST" = true ]; then
                IP_LIST="${IP_LIST}\"${ip}\""
                FIRST=false
              else
                IP_LIST="${IP_LIST}, \"${ip}\""
              fi
            done
            IP_LIST="${IP_LIST}]"
            ;;
          *)
            echo "❌ Modo no válido: $MODE"
            echo "   Opciones: open, current, ips"
            exit 1
            ;;
        esac

        echo ""
        echo "📝 Configuración a aplicar:"
        echo "   authorized_ip_ranges = $IP_LIST"
        echo "   admin_access_cidrs   = $IP_LIST"
        echo ""

        # Backup del archivo original
        cp "$TFVARS" "${TFVARS}.backup"
        echo "💾 Backup creado: ${TFVARS}.backup"

        # Actualizar authorized_ip_ranges usando awk
        awk -v ips="$IP_LIST" '
          /^authorized_ip_ranges[[:space:]]*=/ {
            print "authorized_ip_ranges = " ips
            # Skip lines until we find the closing bracket
            while (getline && !/^\]/) {}
            next
          }
          /^admin_access_cidrs[[:space:]]*=/ {
            print "admin_access_cidrs = " ips
            # Skip lines until we find the closing bracket
            while (getline && !/^\]/) {}
            next
          }
          { print }
        ' "${TFVARS}.backup" > "$TFVARS"

        echo ""
        echo "✅ Archivo $TFVARS actualizado"
        echo ""
        echo "📋 Valores actuales:"
        grep -A1 "authorized_ip_ranges\|admin_access_cidrs" "$TFVARS" | head -6
        echo ""
        echo "💡 Próximos pasos:"
        echo "   1. terraform plan -var-file=$TFVARS"
        echo "   2. terraform apply -var-file=$TFVARS"
        echo ""
        if [ "$MODE" = "open" ]; then
          echo "⚠️  RECUERDA: Cierra el acceso después de terminar:"
          echo "   task aks:ip-access MODE=current"
        fi

  aks:my-ip:
    desc: "Muestra tu IP pública actual"
    cmds:
      - |
        echo "🔎 Detectando tu IP pública..."
        IP=$(curl -s https://api.ipify.org || curl -s https://ifconfig.me || curl -s https://icanhazip.com)
        if [ -z "$IP" ]; then
          echo "❌ No se pudo detectar la IP"
          exit 1
        fi
        echo ""
        echo "🌐 Tu IP pública actual: $IP"
        echo ""
        echo "Para actualizar el tfvars con esta IP:"
        echo "   task aks:ip-access MODE=current"

  dns:set-label:
    desc: "Asigna un DNS label al public IP de un Service LoadBalancer en AKS"
    summary: |
      Uso: task dns:set-label SERVICE=<nombre> [NS=<namespace>] LABEL=<dns-label>

      Ejemplos:
        task dns:set-label SERVICE=frontend LABEL=dsrp-frontend
        task dns:set-label SERVICE=qdrant NS=default LABEL=qdrant-dsrp
        task dns:set-label SERVICE=flyte-flyte-binary NS=flyte LABEL=flyte-dsrp
    vars:
      SERVICE: '{{.SERVICE | default ""}}'
      NS: '{{.NS | default "default"}}'
      LABEL: '{{.LABEL | default ""}}'
    preconditions:
      - sh: '[ -n "{{.SERVICE}}" ]'
        msg: "Error: SERVICE es requerido. Uso: task dns:set-label SERVICE=<nombre> LABEL=<dns-label>"
      - sh: '[ -n "{{.LABEL}}" ]'
        msg: "Error: LABEL es requerido. Uso: task dns:set-label SERVICE=<nombre> LABEL=<dns-label>"
      - sh: command -v kubectl &> /dev/null
        msg: "Error: kubectl no está instalado o no está en el PATH"
      - sh: command -v az &> /dev/null
        msg: "Error: Azure CLI (az) no está instalado o no está en el PATH"
    cmds:
      - |
        set -euo pipefail

        SERVICE_NAME="{{.SERVICE}}"
        SERVICE_NS="{{.NS}}"
        DNS_LABEL="{{.LABEL}}"

        echo ""
        echo "🔧 Configuración:"
        echo "   Service:   $SERVICE_NAME"
        echo "   Namespace: $SERVICE_NS"
        echo "   DNS Label: $DNS_LABEL"
        echo ""

        # Verificar que el service existe
        echo "🔎 Verificando Service..."
        if ! kubectl get svc "$SERVICE_NAME" -n "$SERVICE_NS" &> /dev/null; then
          echo "❌ El Service '$SERVICE_NAME' no existe en el namespace '$SERVICE_NS'"
          echo ""
          echo "Services disponibles en '$SERVICE_NS':"
          kubectl get svc -n "$SERVICE_NS" --no-headers 2>/dev/null | awk '{print "   - " $1}' || echo "   (ninguno)"
          exit 1
        fi

        # Verificar tipo de service
        SVC_TYPE=$(kubectl get svc "$SERVICE_NAME" -n "$SERVICE_NS" -o jsonpath='{.spec.type}')
        if [ "$SVC_TYPE" != "LoadBalancer" ]; then
          echo "❌ El Service '$SERVICE_NAME' es tipo '$SVC_TYPE', debe ser 'LoadBalancer'"
          exit 1
        fi

        # Obtener IP del LoadBalancer
        echo "🔎 Obteniendo IP del LoadBalancer..."
        IP=""
        RETRIES=0
        MAX_RETRIES=12  # 2 minutos máximo

        while [ -z "$IP" ] && [ $RETRIES -lt $MAX_RETRIES ]; do
          IP=$(kubectl get svc "$SERVICE_NAME" -n "$SERVICE_NS" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          if [ -z "$IP" ]; then
            RETRIES=$((RETRIES + 1))
            echo "   ⏳ Esperando IP pública... (intento $RETRIES/$MAX_RETRIES)"
            sleep 10
          fi
        done

        if [ -z "$IP" ]; then
          echo "❌ No se pudo obtener la IP pública después de $MAX_RETRIES intentos"
          echo "   Verifica el estado del LoadBalancer:"
          echo "   kubectl describe svc $SERVICE_NAME -n $SERVICE_NS"
          exit 1
        fi
        echo "✅ IP encontrada: $IP"

        # Buscar el recurso Public IP en Azure
        echo ""
        echo "🔎 Buscando recurso Public IP en Azure..."

        # Obtener RG y nombre del Public IP
        RESULT=$(az network public-ip list --query "[?ipAddress=='$IP'].[resourceGroup,name]" -o tsv 2>/dev/null | head -n1)

        if [ -z "$RESULT" ]; then
          echo "❌ No se encontró el Public IP '$IP' en Azure"
          echo ""
          echo "Posibles causas:"
          echo "   - La suscripción de Azure no es la correcta"
          echo "   - El Public IP fue creado en otra suscripción"
          echo ""
          echo "Suscripción actual:"
          az account show --query '{Name:name, Id:id}' -o table
          exit 1
        fi

        RG=$(echo "$RESULT" | awk '{print $1}')
        NAME=$(echo "$RESULT" | awk '{print $2}')

        echo "✅ Recurso encontrado:"
        echo "   Resource Group: $RG"
        echo "   Public IP Name: $NAME"

        # Asignar DNS label
        echo ""
        echo "🏷️  Asignando DNS label '$DNS_LABEL'..."
        if ! az network public-ip update \
          --resource-group "$RG" \
          --name "$NAME" \
          --dns-name "$DNS_LABEL" \
          --output none 2>&1; then
          echo "❌ Error al asignar el DNS label"
          echo "   Puede que el label '$DNS_LABEL' ya esté en uso en la región"
          exit 1
        fi

        # Mostrar FQDN resultante
        FQDN=$(az network public-ip show \
          --resource-group "$RG" \
          --name "$NAME" \
          --query "dnsSettings.fqdn" -o tsv)

        echo ""
        echo "✅ ¡DNS configurado exitosamente!"
        echo ""
        echo "📋 Resumen:"
        echo "   IP:   $IP"
        echo "   FQDN: $FQDN"
        echo ""
        echo "🌐 Puedes acceder al servicio en:"
        echo "   http://$FQDN"

  # ===========================================================================
  # Azure Storage Tasks for ML Pipeline Data
  # ===========================================================================

  storage:create:
    desc: "Crea Azure Storage Account para datos del pipeline ML"
    summary: |
      Crea un Storage Account y container para almacenar datos del pipeline ML.

      Uso:
        task storage:create
        task storage:create STORAGE_RG=my-rg STORAGE_NAME=mystorageaccount

      Variables:
        STORAGE_RG: Resource group (default: rg-dsrp-ml-data)
        STORAGE_NAME: Storage account name (auto-generated if not provided)
        CONTAINER: Container name (default: ml-pipeline-data)
    vars:
      STORAGE_RG: '{{.STORAGE_RG | default "rg-dsrp-ml-data"}}'
      STORAGE_NAME: '{{.STORAGE_NAME | default ""}}'
      CONTAINER: '{{.CONTAINER | default "ml-pipeline-data"}}'
      LOCATION: '{{.LOCATION | default "eastus"}}'
    cmds:
      - |
        set -euo pipefail

        RG="{{.STORAGE_RG}}"
        CONTAINER="{{.CONTAINER}}"
        LOCATION="{{.LOCATION}}"

        # Generate storage name if not provided
        if [ -z "{{.STORAGE_NAME}}" ]; then
          RANDOM_SUFFIX=$(openssl rand -hex 4 | tr '[:upper:]' '[:lower:]')
          STORAGE_NAME="dsrpmldata${RANDOM_SUFFIX}"
        else
          STORAGE_NAME="{{.STORAGE_NAME}}"
        fi

        echo ""
        echo "🗄️  Creando Azure Storage para ML Pipeline"
        echo "   Resource Group:  $RG"
        echo "   Storage Account: $STORAGE_NAME"
        echo "   Container:       $CONTAINER"
        echo "   Location:        $LOCATION"
        echo ""

        # Verify Azure login
        if ! az account show &> /dev/null; then
          echo "⚠️  Autenticando en Azure..."
          az login
        fi

        # Create resource group
        echo "1️⃣ Creando resource group..."
        if az group show --name "$RG" &> /dev/null; then
          echo "✅ Resource group ya existe"
        else
          az group create --name "$RG" --location "$LOCATION" --output none
          echo "✅ Resource group creado"
        fi

        # Create storage account
        echo "2️⃣ Creando storage account..."
        if az storage account show --name "$STORAGE_NAME" --resource-group "$RG" &> /dev/null; then
          echo "✅ Storage account ya existe"
        else
          az storage account create \
            --resource-group "$RG" \
            --name "$STORAGE_NAME" \
            --sku Standard_LRS \
            --encryption-services blob \
            --location "$LOCATION" \
            --allow-blob-public-access false \
            --min-tls-version TLS1_2 \
            --output none
          echo "✅ Storage account creado"
        fi

        sleep 3

        # Create container
        echo "3️⃣ Creando container..."
        az storage container create \
          --name "$CONTAINER" \
          --account-name "$STORAGE_NAME" \
          --auth-mode login \
          --output none 2>/dev/null || echo "✅ Container ya existe"

        # Get connection string
        echo ""
        echo "4️⃣ Obteniendo connection string..."
        CONN_STRING=$(az storage account show-connection-string \
          --resource-group "$RG" \
          --name "$STORAGE_NAME" \
          --output tsv)

        # Get account key
        ACCOUNT_KEY=$(az storage account keys list \
          --resource-group "$RG" \
          --account-name "$STORAGE_NAME" \
          --query '[0].value' -o tsv)

        echo ""
        echo "✅ ¡Storage creado exitosamente!"
        echo ""
        echo "📋 Configuración:"
        echo "   AZURE_STORAGE_ACCOUNT_NAME: $STORAGE_NAME"
        echo "   AZURE_CONTAINER_NAME: $CONTAINER"
        echo ""
        echo "🔐 Connection String (guárdalo de forma segura):"
        echo "   $CONN_STRING"
        echo ""
        echo "💡 Para crear el secret de Kubernetes:"
        echo "   task storage:create-k8s-secret STORAGE_NAME=$STORAGE_NAME STORAGE_RG=$RG"

  storage:upload:
    desc: "Sube archivos locales a Azure Storage"
    summary: |
      Sube archivos o directorios a Azure Blob Storage.

      Uso:
        task storage:upload LOCAL=./data REMOTE=raw STORAGE_NAME=mystorageaccount

      Variables:
        LOCAL: Ruta local del archivo/directorio
        REMOTE: Prefijo remoto en el container
        STORAGE_NAME: Nombre del storage account
        CONTAINER: Container name (default: ml-pipeline-data)
    vars:
      LOCAL: '{{.LOCAL | default ""}}'
      REMOTE: '{{.REMOTE | default ""}}'
      STORAGE_NAME: '{{.STORAGE_NAME | default ""}}'
      CONTAINER: '{{.CONTAINER | default "ml-pipeline-data"}}'
    preconditions:
      - sh: '[ -n "{{.LOCAL}}" ]'
        msg: "Error: LOCAL es requerido. Uso: task storage:upload LOCAL=./data REMOTE=prefix"
      - sh: '[ -n "{{.STORAGE_NAME}}" ]'
        msg: "Error: STORAGE_NAME es requerido."
      - sh: '[ -e "{{.LOCAL}}" ]'
        msg: "Error: El archivo/directorio {{.LOCAL}} no existe"
    cmds:
      - |
        set -euo pipefail

        LOCAL="{{.LOCAL}}"
        REMOTE="{{.REMOTE}}"
        STORAGE_NAME="{{.STORAGE_NAME}}"
        CONTAINER="{{.CONTAINER}}"

        echo ""
        echo "📤 Subiendo datos a Azure Storage"
        echo "   Local:     $LOCAL"
        echo "   Remote:    $CONTAINER/$REMOTE"
        echo "   Storage:   $STORAGE_NAME"
        echo ""

        if [ -d "$LOCAL" ]; then
          echo "📁 Subiendo directorio..."
          az storage blob upload-batch \
            --account-name "$STORAGE_NAME" \
            --destination "$CONTAINER" \
            --destination-path "$REMOTE" \
            --source "$LOCAL" \
            --auth-mode login \
            --overwrite
        else
          echo "📄 Subiendo archivo..."
          FILENAME=$(basename "$LOCAL")
          az storage blob upload \
            --account-name "$STORAGE_NAME" \
            --container-name "$CONTAINER" \
            --file "$LOCAL" \
            --name "${REMOTE}/${FILENAME}" \
            --auth-mode login \
            --overwrite
        fi

        echo ""
        echo "✅ Upload completado!"

  storage:download:
    desc: "Descarga archivos de Azure Storage"
    summary: |
      Descarga archivos o directorios de Azure Blob Storage.

      Uso:
        task storage:download REMOTE=raw LOCAL=./data STORAGE_NAME=mystorageaccount

      Variables:
        REMOTE: Prefijo remoto en el container
        LOCAL: Ruta local de destino
        STORAGE_NAME: Nombre del storage account
        CONTAINER: Container name (default: ml-pipeline-data)
    vars:
      REMOTE: '{{.REMOTE | default ""}}'
      LOCAL: '{{.LOCAL | default ""}}'
      STORAGE_NAME: '{{.STORAGE_NAME | default ""}}'
      CONTAINER: '{{.CONTAINER | default "ml-pipeline-data"}}'
    preconditions:
      - sh: '[ -n "{{.REMOTE}}" ]'
        msg: "Error: REMOTE es requerido. Uso: task storage:download REMOTE=prefix LOCAL=./data"
      - sh: '[ -n "{{.LOCAL}}" ]'
        msg: "Error: LOCAL es requerido."
      - sh: '[ -n "{{.STORAGE_NAME}}" ]'
        msg: "Error: STORAGE_NAME es requerido."
    cmds:
      - |
        set -euo pipefail

        REMOTE="{{.REMOTE}}"
        LOCAL="{{.LOCAL}}"
        STORAGE_NAME="{{.STORAGE_NAME}}"
        CONTAINER="{{.CONTAINER}}"

        echo ""
        echo "📥 Descargando datos de Azure Storage"
        echo "   Remote:    $CONTAINER/$REMOTE"
        echo "   Local:     $LOCAL"
        echo "   Storage:   $STORAGE_NAME"
        echo ""

        mkdir -p "$LOCAL"

        az storage blob download-batch \
          --account-name "$STORAGE_NAME" \
          --source "$CONTAINER" \
          --destination "$LOCAL" \
          --pattern "${REMOTE}/*" \
          --auth-mode login

        echo ""
        echo "✅ Download completado!"

  storage:list:
    desc: "Lista archivos en Azure Storage"
    vars:
      STORAGE_NAME: '{{.STORAGE_NAME | default ""}}'
      CONTAINER: '{{.CONTAINER | default "ml-pipeline-data"}}'
      PREFIX: '{{.PREFIX | default ""}}'
    preconditions:
      - sh: '[ -n "{{.STORAGE_NAME}}" ]'
        msg: "Error: STORAGE_NAME es requerido."
    cmds:
      - |
        set -euo pipefail

        STORAGE_NAME="{{.STORAGE_NAME}}"
        CONTAINER="{{.CONTAINER}}"
        PREFIX="{{.PREFIX}}"

        echo ""
        echo "📋 Listando archivos en Azure Storage"
        echo "   Storage:   $STORAGE_NAME"
        echo "   Container: $CONTAINER"
        if [ -n "$PREFIX" ]; then
          echo "   Prefix:    $PREFIX"
        fi
        echo ""

        az storage blob list \
          --account-name "$STORAGE_NAME" \
          --container-name "$CONTAINER" \
          --prefix "$PREFIX" \
          --auth-mode login \
          --query "[].{Name:name, Size:properties.contentLength, Modified:properties.lastModified}" \
          --output table

  storage:create-k8s-secret:
    desc: "Crea un Kubernetes Secret con las credenciales de Azure Storage"
    summary: |
      Crea un secret de Kubernetes con las credenciales del storage account.

      Uso:
        task storage:create-k8s-secret STORAGE_NAME=mystorageaccount STORAGE_RG=my-rg

      Variables:
        STORAGE_NAME: Nombre del storage account
        STORAGE_RG: Resource group del storage account
        SECRET_NAME: Nombre del secret (default: azure-storage-credentials)
        NAMESPACE: Namespace de Kubernetes (default: default)
    vars:
      STORAGE_NAME: '{{.STORAGE_NAME | default ""}}'
      STORAGE_RG: '{{.STORAGE_RG | default "rg-dsrp-ml-data"}}'
      SECRET_NAME: '{{.SECRET_NAME | default "azure-storage-credentials"}}'
      NAMESPACE: '{{.NAMESPACE | default "default"}}'
      CONTAINER: '{{.CONTAINER | default "ml-pipeline-data"}}'
    preconditions:
      - sh: '[ -n "{{.STORAGE_NAME}}" ]'
        msg: "Error: STORAGE_NAME es requerido."
      - sh: command -v kubectl &> /dev/null
        msg: "Error: kubectl no está instalado"
    cmds:
      - |
        set -euo pipefail

        STORAGE_NAME="{{.STORAGE_NAME}}"
        STORAGE_RG="{{.STORAGE_RG}}"
        SECRET_NAME="{{.SECRET_NAME}}"
        NAMESPACE="{{.NAMESPACE}}"
        CONTAINER="{{.CONTAINER}}"

        echo ""
        echo "🔐 Creando Kubernetes Secret para Azure Storage"
        echo "   Storage Account: $STORAGE_NAME"
        echo "   Resource Group:  $STORAGE_RG"
        echo "   Secret Name:     $SECRET_NAME"
        echo "   Namespace:       $NAMESPACE"
        echo ""

        # Get connection string
        echo "1️⃣ Obteniendo credenciales..."
        CONN_STRING=$(az storage account show-connection-string \
          --resource-group "$STORAGE_RG" \
          --name "$STORAGE_NAME" \
          --output tsv)

        ACCOUNT_KEY=$(az storage account keys list \
          --resource-group "$STORAGE_RG" \
          --account-name "$STORAGE_NAME" \
          --query '[0].value' -o tsv)

        # Delete existing secret if exists
        echo "2️⃣ Creando secret..."
        kubectl delete secret "$SECRET_NAME" -n "$NAMESPACE" 2>/dev/null || true

        # Create secret
        kubectl create secret generic "$SECRET_NAME" \
          --namespace "$NAMESPACE" \
          --from-literal=AZURE_STORAGE_ACCOUNT_NAME="$STORAGE_NAME" \
          --from-literal=AZURE_STORAGE_ACCOUNT_KEY="$ACCOUNT_KEY" \
          --from-literal=AZURE_STORAGE_CONNECTION_STRING="$CONN_STRING" \
          --from-literal=AZURE_CONTAINER_NAME="$CONTAINER"

        echo ""
        echo "✅ Secret creado exitosamente!"
        echo ""
        echo "📋 Para usar en un Pod:"
        echo "   envFrom:"
        echo "     - secretRef:"
        echo "         name: $SECRET_NAME"

  storage:sync-to-pod:
    desc: "Sincroniza datos locales a un Pod en Kubernetes via Azure Storage"
    summary: |
      Sube datos locales a Azure Storage y luego sincroniza a un Pod.

      Uso:
        task storage:sync-to-pod LOCAL=./data POD=airflow-worker-0 POD_PATH=/opt/airflow/data

      Este proceso:
      1. Sube datos locales a Azure Storage
      2. Ejecuta azcopy en el Pod para descargar los datos

      Variables:
        LOCAL: Ruta local de origen
        POD: Nombre del Pod
        POD_PATH: Ruta de destino en el Pod
        STORAGE_NAME: Nombre del storage account
        NAMESPACE: Namespace del Pod (default: default)
    vars:
      LOCAL: '{{.LOCAL | default ""}}'
      POD: '{{.POD | default ""}}'
      POD_PATH: '{{.POD_PATH | default "/opt/airflow/data"}}'
      STORAGE_NAME: '{{.STORAGE_NAME | default ""}}'
      NAMESPACE: '{{.NAMESPACE | default "default"}}'
      CONTAINER: '{{.CONTAINER | default "ml-pipeline-data"}}'
    preconditions:
      - sh: '[ -n "{{.LOCAL}}" ]'
        msg: "Error: LOCAL es requerido."
      - sh: '[ -n "{{.POD}}" ]'
        msg: "Error: POD es requerido."
      - sh: '[ -n "{{.STORAGE_NAME}}" ]'
        msg: "Error: STORAGE_NAME es requerido."
    cmds:
      - |
        set -euo pipefail

        LOCAL="{{.LOCAL}}"
        POD="{{.POD}}"
        POD_PATH="{{.POD_PATH}}"
        STORAGE_NAME="{{.STORAGE_NAME}}"
        NAMESPACE="{{.NAMESPACE}}"
        CONTAINER="{{.CONTAINER}}"

        echo ""
        echo "🔄 Sincronizando datos a Pod via Azure Storage"
        echo "   Local:     $LOCAL"
        echo "   Pod:       $POD ($NAMESPACE)"
        echo "   Pod Path:  $POD_PATH"
        echo "   Storage:   $STORAGE_NAME"
        echo ""

        # Step 1: Upload to Azure Storage
        echo "📤 Step 1: Subiendo a Azure Storage..."
        REMOTE_PREFIX="sync-$(date +%Y%m%d-%H%M%S)"

        if [ -d "$LOCAL" ]; then
          az storage blob upload-batch \
            --account-name "$STORAGE_NAME" \
            --destination "$CONTAINER" \
            --destination-path "$REMOTE_PREFIX" \
            --source "$LOCAL" \
            --auth-mode login \
            --overwrite
        else
          FILENAME=$(basename "$LOCAL")
          az storage blob upload \
            --account-name "$STORAGE_NAME" \
            --container-name "$CONTAINER" \
            --file "$LOCAL" \
            --name "${REMOTE_PREFIX}/${FILENAME}" \
            --auth-mode login \
            --overwrite
        fi

        echo "✅ Upload completado"
        echo ""

        # Step 2: Download in Pod using Azure CLI
        echo "📥 Step 2: Descargando en Pod..."

        # Check if Pod has azcopy or az cli
        kubectl exec -n "$NAMESPACE" "$POD" -- mkdir -p "$POD_PATH"

        # Try to download using az cli in pod
        kubectl exec -n "$NAMESPACE" "$POD" -- sh -c "
          if command -v az &> /dev/null; then
            az storage blob download-batch \
              --account-name $STORAGE_NAME \
              --source $CONTAINER \
              --destination $POD_PATH \
              --pattern '${REMOTE_PREFIX}/*' \
              --auth-mode login
          else
            echo 'Warning: az cli not available in pod. Manual download required.'
            echo 'Use: kubectl cp to copy files directly'
          fi
        " || echo "Note: Using kubectl cp as fallback..."

        echo ""
        echo "✅ Sincronización completada!"
        echo ""
        echo "📋 Datos disponibles en:"
        echo "   Pod: $POD:$POD_PATH"
        echo "   Azure: $CONTAINER/$REMOTE_PREFIX"

  ollama:deploy:
    desc: "Despliega Ollama en Kubernetes"
    summary: |
      Despliega Ollama con el modelo configurado en el cluster de Kubernetes.

      Uso:
        task ollama:deploy
        task ollama:deploy MODEL=mistral:7b

      Variables:
        MODEL: Modelo de Ollama (default: llama3.2:3b)
        NAMESPACE: Namespace (default: default)
    vars:
      MODEL: '{{.MODEL | default "llama3.2:3b"}}'
      NAMESPACE: '{{.NAMESPACE | default "default"}}'
    preconditions:
      - sh: command -v kubectl &> /dev/null
        msg: "Error: kubectl no está instalado"
    cmds:
      - |
        set -euo pipefail

        MODEL="{{.MODEL}}"
        NAMESPACE="{{.NAMESPACE}}"
        K8S_DIR="../k8s"

        echo ""
        echo "🤖 Desplegando Ollama en Kubernetes"
        echo "   Model:     $MODEL"
        echo "   Namespace: $NAMESPACE"
        echo ""

        # Update ConfigMap with model
        echo "1️⃣ Actualizando ConfigMap con modelo..."
        kubectl create configmap ollama-config \
          --namespace "$NAMESPACE" \
          --from-literal=OLLAMA_MODEL="$MODEL" \
          --from-literal=OLLAMA_HOST="0.0.0.0" \
          --from-literal=OLLAMA_KEEP_ALIVE="24h" \
          --from-literal=OLLAMA_NUM_PARALLEL="2" \
          --dry-run=client -o yaml | kubectl apply -f -

        # Apply deployment
        echo "2️⃣ Aplicando deployment..."
        kubectl apply -f "$K8S_DIR/ollama-deployment.yaml" -n "$NAMESPACE"

        # Wait for rollout
        echo "3️⃣ Esperando rollout..."
        kubectl rollout status deployment/ollama -n "$NAMESPACE" --timeout=300s

        echo ""
        echo "✅ Ollama desplegado exitosamente!"
        echo ""
        echo "📋 Verificar estado:"
        echo "   kubectl get pods -l app=ollama -n $NAMESPACE"
        echo ""
        echo "🔗 Acceder localmente:"
        echo "   kubectl port-forward svc/ollama 11434:11434 -n $NAMESPACE"
        echo "   curl http://localhost:11434/api/tags"

  ollama:change-model:
    desc: "Cambia el modelo de Ollama en un deployment existente"
    summary: |
      Actualiza el modelo de Ollama sin recrear el deployment.

      Uso:
        task ollama:change-model MODEL=mistral:7b

      Modelos disponibles:
        - llama3.2:3b (default)
        - llama3.2:1b (lightweight)
        - mistral:7b
        - codellama:7b
        - phi:2.7b
    vars:
      MODEL: '{{.MODEL | default ""}}'
      NAMESPACE: '{{.NAMESPACE | default "default"}}'
    preconditions:
      - sh: '[ -n "{{.MODEL}}" ]'
        msg: "Error: MODEL es requerido. Uso: task ollama:change-model MODEL=mistral:7b"
    cmds:
      - |
        set -euo pipefail

        MODEL="{{.MODEL}}"
        NAMESPACE="{{.NAMESPACE}}"

        echo ""
        echo "🔄 Cambiando modelo de Ollama"
        echo "   Nuevo modelo: $MODEL"
        echo "   Namespace:    $NAMESPACE"
        echo ""

        # Update ConfigMap
        echo "1️⃣ Actualizando ConfigMap..."
        kubectl patch configmap ollama-config -n "$NAMESPACE" \
          --type merge \
          -p "{\"data\":{\"OLLAMA_MODEL\":\"$MODEL\"}}"

        # Restart deployment to pull new model
        echo "2️⃣ Reiniciando deployment..."
        kubectl rollout restart deployment/ollama -n "$NAMESPACE"

        # Wait for rollout
        echo "3️⃣ Esperando rollout..."
        kubectl rollout status deployment/ollama -n "$NAMESPACE" --timeout=600s

        echo ""
        echo "✅ Modelo cambiado a: $MODEL"
        echo ""
        echo "📋 Verificar modelo activo:"
        echo "   kubectl exec -it \$(kubectl get pod -l app=ollama -o name | head -1) -- ollama list"
