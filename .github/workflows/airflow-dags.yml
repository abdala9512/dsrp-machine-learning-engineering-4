name: Deploy Airflow DAGs

on:
  push:
    branches: [main]
    paths:
      - "dags/**"
      - ".github/workflows/airflow-dags.yml"
  workflow_dispatch:

env:
  AIRFLOW_NAMESPACE: airflow

jobs:
  deploy-dags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS Credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Get Airflow Scheduler Pod
        id: get-pod
        run: |
          POD_NAME=$(kubectl get pods -n ${{ env.AIRFLOW_NAMESPACE }} \
            -l component=scheduler \
            -o jsonpath='{.items[0].metadata.name}')
          echo "pod_name=$POD_NAME" >> $GITHUB_OUTPUT

      - name: Copy DAGs to Scheduler Pod
        run: |
          echo "Copying DAGs to pod: ${{ steps.get-pod.outputs.pod_name }}"

          # Copy all .py files from dags/ to the scheduler pod
          for dag_file in dags/*.py; do
            if [ -f "$dag_file" ]; then
              echo "Uploading: $dag_file"
              kubectl cp "$dag_file" \
                "${{ env.AIRFLOW_NAMESPACE }}/${{ steps.get-pod.outputs.pod_name }}:/opt/airflow/dags/$(basename $dag_file)" \
                -c scheduler
            fi
          done

      - name: Verify DAGs
        run: |
          echo "Listing DAGs in scheduler pod:"
          kubectl exec -n ${{ env.AIRFLOW_NAMESPACE }} \
            ${{ steps.get-pod.outputs.pod_name }} \
            -c scheduler -- ls -la /opt/airflow/dags/

      - name: Summary
        run: |
          echo "## DAGs Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to namespace: \`${{ env.AIRFLOW_NAMESPACE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files uploaded:" >> $GITHUB_STEP_SUMMARY
          for dag_file in dags/*.py; do
            if [ -f "$dag_file" ]; then
              echo "- \`$(basename $dag_file)\`" >> $GITHUB_STEP_SUMMARY
            fi
          done
