name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - "dsrp_ml_utils/**"
      - ".github/workflows/pypi-publish.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build package
        working-directory: dsrp_ml_utils
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dsrp_ml_utils/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/dsrp-ml-utils
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # For trusted publishing (OIDC), no token needed
          # If using API token instead, uncomment below:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
