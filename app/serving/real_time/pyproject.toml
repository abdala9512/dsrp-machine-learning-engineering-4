[project]
name = "movie-recommendation-api"
version = "0.1.0"
description = "Movie recommendation API with LightGBM LTR model, Qdrant search, and Prometheus metrics"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.0.0",
    "litserve>=0.2.0",
    "mlflow>=2.9.0",
    "numpy>=1.24.0",
    "polars>=0.20.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
