# Docker Compose for DSRP Movie Recommendation Stack
#
# This compose file deploys the complete ML pipeline locally:
# - Frontend: React app for movie search
# - Backend: FastAPI orchestrating ML service and IMDB API
# - ML Service: LightGBM LTR model serving with Qdrant
# - Prometheus: Metrics collection
# - Grafana: Metrics visualization
#
# Usage:
#   # Start all services
#   docker compose up -d
#
#   # Start only frontend (direct IMDB mode)
#   docker compose up frontend-standalone -d
#
#   # Start full ML pipeline
#   docker compose --profile ml up -d
#
#   # View logs
#   docker compose logs -f
#
#   # Stop all services
#   docker compose down

services:
  # ==========================================================================
  # Frontend - Standalone mode (direct IMDB API)
  # ==========================================================================
  frontend-standalone:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      # Direct IMDB API mode (no backend needed)
      - VITE_API_MODE=imdb
      - VITE_IMDB_API_BASE_URL=https://api.imdbapi.dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - standalone

  # ==========================================================================
  # Frontend - Backend mode (ML recommendations)
  # ==========================================================================
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_MODE=backend
        - VITE_BACKEND_URL=http://backend:8080
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Backend API - Orchestrates Frontend, ML Service, and IMDB API
  # ==========================================================================
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_SERVICE_TIMEOUT=30.0
      - IMDB_API_URL=https://api.imdbapi.dev
      - IMDB_API_TIMEOUT=10.0
      - ENABLE_ML_SERVICE=true
      - CORS_ORIGINS=*
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # ML Service - Movie Recommendation API
  # ==========================================================================
  ml-service:
    build:
      context: ./app/serving/real_time
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=1
      # DagsHub/MLflow configuration
      - DAGSHUB_USER_TOKEN=${DAGSHUB_USER_TOKEN:-}
      - DAGSHUB_REPO_OWNER=abdala9512
      - DAGSHUB_REPO_NAME=dsrp-machine-learning-engineering-4
      # LTR Model
      - LTR_MODEL_NAME=ltr-dsrpflix-prd-ENE12
      - LTR_MODEL_ALIAS=champion
      # Qdrant - use external Qdrant or mock mode
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_COLLECTION=imdb-movies-hybrid
      - MOCK_QDRANT=${MOCK_QDRANT:-false}
      # Prometheus
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc_dir
    volumes:
      - ml-service-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    profiles:
      - ml

  # ==========================================================================
  # Qdrant - Vector Database (optional, for local development)
  # ==========================================================================
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - ml

  # ==========================================================================
  # Prometheus - Metrics Collection
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Grafana - Metrics Visualization
  # ==========================================================================
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3001:3000"
    volumes:
      - ./app/serving/real_time/monitoring/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ml-service-data:
  qdrant-data:
  prometheus-data:
  grafana-data:

# Network configuration
networks:
  default:
    name: dsrp-network
